# Official corpus. Hosts are checked at load: www.utimf.com, utimf.com, AMFI, and SEBI only.
#
# Factsheet, KIM, and SID PDFs for these schemes are published on
# d3ce1o48hc5oli.cloudfront.net and doc.utimf.com. Those hosts are outside the
# allowlist, so they are not corpus URLs. Each scheme row below is the official
# www.utimf.com scheme page. The fetched HTML publishes exit load, minimum
# investment (lumpsum), benchmark, and riskometer. Daily TER (%) is labeled
# but the figure is filled in the browser after load, so expense_ratio has
# no source span. Minimum SIP is not a separate label. primary_url in
# schemes.yaml points at the same page.
#
# The shared factsheet row is the UTI downloads page, which is the public
# factsheet index (year and month). The PDF file it links to is on CloudFront
# and is not indexed.

